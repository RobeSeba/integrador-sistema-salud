{% extends "base.html" %}
{% block titulo %}Página no encontrada{% endblock %}
{% block contenido %}
<div class="error-pagina">
  <p class="error-codigo">404</p>
  <h1>Página no encontrada</h1>
  <p>La dirección solicitada no corresponde a ningún recurso del sistema.</p>
  {% if mensaje %}<p class="error-detalle">{{ mensaje }}</p>{% endif %}
  <a href="{{ url_for('tablero.panel') }}" class="boton">Ir al panel</a>
</div>
{% endblock %}
